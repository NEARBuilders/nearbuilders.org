# Static local development databases — managed by hand, never generated.
# If a host port is already taken, change the left side of the ports mapping
# and update the matching *_DATABASE_URL in .env to match.
#
# v2 database topology: one shared Postgres per concern. Plugin workspaces
# scope into their own `plugin_<slug>` schema on the shared api database —
# point every <SLUG>_DATABASE_URL secret at the same postgres:// URL.
# Migrate v1 per-plugin databases with `pnpm run db:consolidate`.
services:
  postgres-api:
    image: ghcr.io/nearbuilders/mirror-postgres:17-alpine
    environment:
      POSTGRES_USER: everythingdev
      POSTGRES_PASSWORD: everythingdev
      POSTGRES_DB: api_db
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U everythingdev -d api_db"]
      interval: 3s
      timeout: 3s
      retries: 5
    volumes:
      - postgres_api_data:/var/lib/postgresql/data

  postgres-auth:
    image: ghcr.io/nearbuilders/mirror-postgres:17-alpine
    environment:
      POSTGRES_USER: everythingdev
      POSTGRES_PASSWORD: everythingdev
      POSTGRES_DB: auth_db
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U everythingdev -d auth_db"]
      interval: 3s
      timeout: 3s
      retries: 5
    volumes:
      - postgres_auth_data:/var/lib/postgresql/data

  postgres-api-test:
    image: ghcr.io/nearbuilders/mirror-postgres:17-alpine
    environment:
      POSTGRES_USER: everythingdev
      POSTGRES_PASSWORD: everythingdev
      POSTGRES_DB: api_test_db
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U everythingdev -d api_test_db"]
      interval: 3s
      timeout: 3s
      retries: 5
    volumes:
      - postgres_api_test_data:/var/lib/postgresql/data

  postgres-auth-test:
    image: ghcr.io/nearbuilders/mirror-postgres:17-alpine
    environment:
      POSTGRES_USER: everythingdev
      POSTGRES_PASSWORD: everythingdev
      POSTGRES_DB: auth_test_db
    ports:
      - "5435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U everythingdev -d auth_test_db"]
      interval: 3s
      timeout: 3s
      retries: 5
    volumes:
      - postgres_auth_test_data:/var/lib/postgresql/data

volumes:
  postgres_api_data:
  postgres_auth_data:
  postgres_api_test_data:
  postgres_auth_test_data:
