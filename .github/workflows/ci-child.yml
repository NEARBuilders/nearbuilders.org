name: Child CI Jobs

# CHILD-OWNED — bos upgrade never rewrites this file (#538). This repo's extra
# CI jobs live here. `ci.yml` (framework-owned) calls this workflow in parallel
# with the pinned reusable `ci` call and includes its result in the merge gate.

on:
  workflow_call:

permissions:
  contents: read

jobs:
  ui-palette:
    name: Check UI palette tokens
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: bash scripts/check-ui-palette.sh
