[package]
name = "near-intents-agent-api"
version = "0.1.0"
edition = "2021"
description = "Reference Rust client and owner signers for the NEAR Intents Agent API"
license = "MIT"
publish = false

[features]
default = []
# EIP-712 signing for EVM owners (pulls in alloy).
evm = ["dep:alloy-dyn-abi", "dep:alloy-signer", "dep:alloy-signer-local", "dep:alloy-primitives"]

[dependencies]
base64 = "0.22"
bs58 = "0.5"
ed25519-dalek = "2"
hex = "0.4"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# `preserve_order` is REQUIRED: NEP-366 args must be serialized in the API's key order.
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }

alloy-dyn-abi = { version = "1", features = ["eip712"], optional = true }
alloy-primitives = { version = "1", optional = true }
alloy-signer = { version = "1", optional = true }
alloy-signer-local = { version = "1", optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
